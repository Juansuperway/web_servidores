
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de discos</title>
    <link rel="stylesheet" href="detalle-discos.css">


</head>
<body>

    <header class="detail-page-header">

        <div class="detail-page-heading">
            <h1 id="metricName">DISCOS</h1>
            <p id="stationName">Estación: UAT</p>
        </div>

        <button
            type="button"
            id="closeButton"
            aria-label="Cerrar ventana"
        >
            VOLVER
        </button>

    </header>

            
    <main>
        <section class="disks-section">
            <div class="table-toolbar">
                <input
                    type="search"
                    id="generalSearch"
                    placeholder="Buscar en todos los campos..."
                    aria-label="Buscar en todos los campos"
                >
            </div>

            <div class="table-container">
                <table id="disksTable">
                    <thead id="disksTableHead"></thead>
                    <tbody id="disksTableBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="metricas.js"></script>
    <script src="discos.js"></script>
    <script src="conexion.js"></script>
    <script src="memoria.js"></script>
    <script src="temperatura-gpu.js"></script>
    <script src="camaras.js"></script>
    <script src="servicios-ia.js"></script>
    <script src="detalle-discos.js">
</script>
</body>
</html>
